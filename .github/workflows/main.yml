name: Pull and Run Docker Image from ECR

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual run

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Pull Docker image from ECR
      run: docker pull 762233771753.dkr.ecr.us-east-1.amazonaws.com/networksecurity:latest

    - name: Run container from ECR image
      run: docker run --rm 762233771753.dkr.ecr.us-east-1.amazonaws.com/networksecurity:latest
